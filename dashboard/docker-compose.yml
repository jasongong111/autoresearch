# Autoresearch dashboard — Docker Compose for local runs and cloud-style deployment.
#
# From repo root:
#   docker compose -f dashboard/docker-compose.yml up --build
#
# Open http://127.0.0.1:3847

services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    image: autoresearch-dashboard:latest
    ports:
      - "${DASHBOARD_PORT:-3847}:3847"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "3847"
      # Workspace root: discovers tasks/* child projects when present
      DASHBOARD_PROJECT: /workspace
      # Cursor agent transcripts mounted below (set CURSOR_TRANSCRIPTS_DIR in .env)
      DASHBOARD_TRANSCRIPTS_DIR: /transcripts
    volumes:
      # Mount the repo (or any workspace) read-only; agents write logs on the host
      - ${DASHBOARD_WORKSPACE:-..}:/workspace:ro
      # Cursor agent transcripts for live conversation tab (host path in dashboard/.env)
      - ${CURSOR_TRANSCRIPTS_DIR:-${HOME}/.cursor/projects/Users-jasongong-Desktop-autoresearch/agent-transcripts}:/transcripts:ro
    restart: unless-stopped
