# Autoresearch web app — Docker Compose for local runs and cloud-style deployment.
#
# From repo root:
#   cp .env.example .env   # set CURSOR_API_KEY for runner=cursor
#   docker compose up --build
#
# Open http://127.0.0.1:3847 (backend) or http://127.0.0.1:3000 (frontend nginx)

services:
  agent-core:
    build:
      context: .
      dockerfile: agent_core/Dockerfile
    image: agent-core:latest
    ports:
      - "${AGENT_CORE_PORT:-8766}:8766"
    env_file:
      - .env
    environment:
      GEMMA4_API_KEY: ${GEMMA4_API_KEY:-}
      GEMMA4_MODEL_ID: ${GEMMA4_MODEL_ID:-google/gemma-4-E2B-it}
      GEMMA4_BASE_URL: ${GEMMA4_BASE_URL:-https://api-lm.tr-dev.work/v1}
      LUMENSTONE_API_URL: http://mock-backend:8000/api/v1
    volumes:
      - .:/app:rw
    depends_on:
      - mock-backend
    restart: unless-stopped

  mock-postgres:
    image: postgres:16-alpine
    container_name: lumenstone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumenstone
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumenstone"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    container_name: lumenstone-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@mock-postgres:5432/lumenstone
    depends_on:
      mock-postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
