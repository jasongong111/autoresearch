# Autoresearch web app — Docker Compose for local runs and cloud-style deployment.
#
# From repo root:
#   cp .env.example .env   # set CURSOR_API_KEY for runner=cursor
#   docker compose up --build
#
# Open http://127.0.0.1:3847 (backend) or http://127.0.0.1:3000 (frontend nginx)

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: autoresearch-backend:latest
    ports:
      - "${DASHBOARD_PORT:-3847}:3847"
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "3847"
      DASHBOARD_PROJECT: /workspace
      DASHBOARD_TRANSCRIPTS_DIR: /transcripts
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
    volumes:
      - ${DASHBOARD_WORKSPACE:-.}:/workspace:rw
      - ${CURSOR_TRANSCRIPTS_DIR:-${HOME}/.cursor/projects/Users-jasongong-Desktop-autoresearch/agent-transcripts}:/transcripts:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: autoresearch-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - BACKEND_URL=http://backend:3847
    depends_on:
      - backend
    restart: unless-stopped
